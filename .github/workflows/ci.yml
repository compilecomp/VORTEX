name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Standards self-test (CEP&CC 0.4 chapter 50.6)
        run: cargo run -p cep_lint -- --self-test

      - name: Standards scan
        run: cargo run -p cep_lint

      - name: Engine demo
        run: cargo run -p vortex-cli -- demo

[package]
name = "cep_lint"
description = "CEP&CC 0.4 mechanical linter (standard.md chapter 50): comment discipline, naming, placeholders, DOC-SYNC, self-test manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "cep_lint"
path = "src/lib.rs"

[[bin]]
name = "cep_lint"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std"] }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std"] }
